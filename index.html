<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HoloMenu — Illustrated motion film</title>
<style>
@font-face{font-family:Manrope;src:url('assets/Manrope.ttf')}@font-face{font-family:Editorial;src:url('assets/CormorantGaramond-Italic.ttf');font-style:italic}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#20231c;font-family:Manrope,sans-serif}
#stage{width:1920px;height:1080px;position:absolute;transform-origin:top left;overflow:hidden}#film{width:100%;height:100%;display:block}
#controls{position:fixed;z-index:10;bottom:15px;left:50%;transform:translateX(-50%);padding:10px 18px;border:1px solid #ffffff40;border-radius:50px;background:#20231cee;color:white;font:14px Manrope;display:flex;gap:16px;align-items:center}button{color:inherit;background:none;border:0;cursor:pointer;font:inherit}input{width:240px;accent-color:#d5ff5f}
</style></head><body><main id="stage"><canvas id="film" width="1920" height="1080" aria-label="HoloMenu illustrated 45-second film"></canvas></main><div id="controls"><button id="play">▶ Play film</button><input aria-label="Video time" id="seek" type="range" min="0" max="45" value="0" step="0.01"><span id="time">00:00 / 00:45</span></div><audio id="sound" src="output/mix.wav"></audio><script type="module" src="src/film.js"></script></body></html>
